security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\JsonAuthenticationEntryPoint
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            # 5 tentatives par adresse et par IP sur 15 minutes
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: api_logout

    # F41 : sans compte, seuls l'accueil et les pages du compte sont ouverts. Le moteur du simulateur, les données,
    # les cours en PDF et le trafic réel demandent une connexion (le contrôle est fait ici, pas dans le navigateur).
    access_control:
        - { path: ^/api/(health|login|logout|register|me|password/), roles: PUBLIC_ACCESS }
        - { path: ^/api/trafic/recepteur$, roles: PUBLIC_ACCESS }   # récepteur ADS-B : jeton secret
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
